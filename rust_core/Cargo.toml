[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Trascribe Rust engine — audio capture, VAD, STT, export"
autobins = false

[lib]
name = "rust_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

[[bin]]
name = "trascribe"
path = "src/bin/trascribe.rs"

[[bin]]
name = "trascribe_cli"
path = "src/bin/trascribe_cli.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
cpal = "0.15"
rubato = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "ogg", "flac", "vorbis", "wav", "opt-simd"] }
webrtc-vad = "0.4"
sha2 = "0.10"
hex = "0.4"
hound = "3"
strsim = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream"] }
futures-util = "0.3"
bytes = "1"
dirs = "5"
whisper-rs = "0.14"
docx-rs = { version = "0.4.22", default-features = false }
clap = { version = "4.6.4", features = ["derive"] }
glob = "0.3.4"
sysinfo = "0.39.6"
flutter_rust_bridge = "=2.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Devices_Properties",
    "Win32_System_Com",
]}

[dev-dependencies]


[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

[profile.release]
opt-level = 3
lto = true
strip = true

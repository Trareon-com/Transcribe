[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Trascribe Rust engine — audio capture, VAD, STT, export"

[lib]
name = "rust_core"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
cpal = "0.15"
rubato = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "ogg", "flac", "vorbis", "wav", "opt-simd"] }
webrtc-vad = "0.4"
sha2 = "0.10"
hex = "0.4"
hound = "3"
strsim = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
dirs = "5"
whisper-rs = "0.14"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
strip = true

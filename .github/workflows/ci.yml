name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_OPTIONS: --experimental-vm-modules

jobs:
  rust:
    name: Rust (fmt, clippy, test, audit, deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --lib

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

      - name: Verify Rust library compiles
        run: cargo check --lib

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  rust-build:
    name: Rust build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    defaults:
      run:
        working-directory: rust_core
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install native audio dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - name: cargo build --release --lib
        run: cargo build --release --lib

  flutter-build:
    name: Flutter build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            shell: bash
          - os: macos-latest
            target: macos
            shell: bash
          - os: windows-latest
            target: windows
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev libxkbcommon-dev libegl1-mesa-dev \
            libpulse-dev libpcaudio-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libappindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - name: Build rust_core library
        run: cd rust_core && cargo build --release --lib
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build linux
        if: matrix.target == 'linux'
        run: flutter build linux --release
      - name: flutter build macos
        if: matrix.target == 'macos'
        run: flutter build macos --release
      - name: flutter build windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

  macos-packaging-smoke-test:
    name: macOS packaging smoke test (build, ad-hoc sign, dmg)
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: Download bundled models
        run: |
          mkdir -p models
          curl -fL -o models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          curl -fL -o models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          curl -fL -o models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
      - name: Package macOS (build + ad-hoc sign + dmg)
        run: ./scripts/package_macos.sh
      - name: Upload dmg as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcribe-macos-dmg-unsigned-adhoc
          path: dist/*.dmg
          retention-days: 7

  windows-packaging-smoke-test:
    name: Windows packaging smoke test (build, sign skip, zip)
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: Download bundled models
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin" -OutFile "models\ggml-tiny.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" -OutFile "models\ggml-base.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin" -OutFile "models\ggml-large-v3-turbo-q5_0.bin"
        shell: pwsh
      - name: Package Windows (build + zip)
        run: ./scripts/package_windows.ps1
        shell: pwsh
      - name: Upload zip as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcribe-windows-zip-unsigned
          path: dist/*.zip
          retention-days: 7

  benchmark:
    name: Performance benchmark
    runs-on: ubuntu-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4
      - name: Download benchmark model
        run: |
          curl -fL -o /tmp/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "MODEL_PATH=/tmp/ggml-tiny.bin" >> $GITHUB_ENV
      - name: Generate test audio
        run: |
          python3 -c "
          import struct, math, wave
          with wave.open('/tmp/test_en.wav', 'w') as w:
            w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
            for i in range(16000*5):
              w.writeframes(struct.pack('<h', int(math.sin(2*math.pi*440*i/16000)*8000)))
          "
      - name: Run benchmarks
        run: |
          chmod +x scripts/benchmark.sh
          bash scripts/benchmark.sh

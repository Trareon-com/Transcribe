name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_OPTIONS: --experimental-vm-modules

jobs:
  rust:
    name: Rust (fmt, clippy, test, audit, deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v7
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --lib

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: cargo audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked || true
      - name: cargo deny check
        run: cargo deny check

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  rust-build:
    name: Rust build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    defaults:
      run:
        working-directory: rust_core
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install native audio dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - name: cargo build --release --lib
        run: cargo build --release --lib

  flutter-build:
    name: Flutter build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            shell: bash
          - os: macos-latest
            target: macos
            shell: bash
          - os: windows-latest
            target: windows
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev libxkbcommon-dev libegl1-mesa-dev
          rustup target add x86_64-unknown-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - name: Build rust_core library
        run: cd rust_core && cargo build --release --lib
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build linux
        if: matrix.target == 'linux'
        run: flutter build linux --release
        continue-on-error: true
      - name: flutter build macos
        if: matrix.target == 'macos'
        run: flutter build macos --release
      - name: flutter build windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

  macos-packaging-smoke-test:
    name: macOS packaging smoke test (build, ad-hoc sign, dmg)
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: Package macOS (build + ad-hoc sign + dmg)
        run: ./scripts/package_macos.sh
      - name: Upload dmg as CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: trascribe-macos-dmg-unsigned-adhoc
          path: dist/*.dmg
          retention-days: 7

  windows-packaging-smoke-test:
    name: Windows packaging smoke test (build, sign skip, zip)
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: flutter pub get
        run: flutter pub get
      - name: Package Windows (build + zip)
        run: ./scripts/package_windows.ps1
        shell: pwsh
      - name: Upload zip as CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: trascribe-windows-zip-unsigned
          path: dist/*.zip
          retention-days: 7

  benchmark:
    name: Performance benchmark
    runs-on: ubuntu-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v7
      - name: Run benchmarks
        run: |
          chmod +x scripts/benchmark.sh
          bash scripts/benchmark.sh
        continue-on-error: true

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  source-release:
    name: Build and publish source release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          tar -czf "transcribe-${GITHUB_REF_NAME}.tar.gz" \
            --exclude=.git \
            --exclude=build \
            --exclude=target \
            --exclude=.dart_tool \
            --exclude=rust_core/target \
            .

      - name: Generate checksum
        run: sha256sum "transcribe-${GITHUB_REF_NAME}.tar.gz" > "transcribe-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Upload source archive
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transcribe-${{ github.ref_name }}.tar.gz
            transcribe-${{ github.ref_name }}.tar.gz.sha256

  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core

      - name: Download bundled models
        run: |
          mkdir -p models
          curl -fL -o models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          curl -fL -o models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin

      - name: Build macOS DMG
        run: |
          bash scripts/package_macos.sh "${GITHUB_REF_NAME#v}"

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/transcribe-${{ github.ref_name }}*.dmg
            dist/transcribe-${{ github.ref_name }}*.sha256

  build-windows:
    name: Build Windows ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: rust_core

      - name: Download bundled models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" -OutFile "models\ggml-base.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin" -OutFile "models\ggml-large-v3-turbo-q5_0.bin"

      - name: Build Windows ZIP
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -Version "${GITHUB_REF_NAME#v}"

      - name: Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/transcribe-${{ github.ref_name }}*.zip
            dist/transcribe-${{ github.ref_name }}*.sha256

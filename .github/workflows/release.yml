name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  source-release:
    name: Build and publish source release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          tar -czf "trascribe-${GITHUB_REF_NAME}.tar.gz" \
            --exclude=.git \
            --exclude=build \
            --exclude=target \
            --exclude=.dart_tool \
            --exclude=rust_core/target \
            --exclude=lib/src/rust/frb_generated.* \
            --exclude=lib/src/rust/session.freezed.dart \
            .

      - name: Generate checksum
        run: sha256sum "trascribe-${GITHUB_REF_NAME}.tar.gz" > "trascribe-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Upload source archive
        uses: softprops/action-gh-release@v2
        with:
          files: |
            trascribe-${{ github.ref_name }}.tar.gz
            trascribe-${{ github.ref_name }}.tar.gz.sha256

  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build macOS DMG
        run: |
          bash scripts/package_macos.sh "${GITHUB_REF_NAME#v}"

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/trascribe-${{ github.ref_name }}*.dmg
            dist/trascribe-${{ github.ref_name }}*.sha256

  build-windows:
    name: Build Windows ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows ZIP
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -Version "${GITHUB_REF_NAME#v}"

      - name: Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/trascribe-${{ github.ref_name }}*.zip
            dist/trascribe-${{ github.ref_name }}*.sha256
